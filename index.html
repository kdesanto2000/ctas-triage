<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>CTAS Guided Flow</title>
<meta name="theme-color" content="#0b1f33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CTAS Flow">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="protocol-id">ONTARIO PREHOSPITAL CTAS • v2.0</div>
    <div class="top-actions"><button id="restartTop" class="ghost small">Restart</button></div>
  </header>
  <main>
    <section id="questionView" class="screen">
      <div class="status-row">
        <div id="stepLabel" class="step-label">START</div>
        <div id="currentBest" class="current-best">CTAS —</div>
      </div>
      <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
      <div id="sourceTag" class="source-tag"></div>
      <h1 id="questionTitle"></h1>
      <p id="questionPrompt" class="prompt"></p>
      <div id="questionHelp" class="help"></div>
      <div id="answerArea"></div>
    </section>

    <section id="resultView" class="screen hidden">
      <div id="resultKicker" class="result-kicker">PROTOCOL RESULT</div>
      <div id="resultBadge" class="result-badge">—</div>
      <h1 id="resultTitle"></h1>
      <p id="resultSummary" class="result-summary"></p>
      <div class="result-card">
        <h2>Why this level</h2>
        <div id="rationaleList"></div>
      </div>
      <div class="result-card">
        <h2>Assessment trail</h2>
        <div id="trailList"></div>
      </div>
      <div id="resultCaution" class="caution"></div>
      <div class="result-actions">
        <button id="newAssessment" class="primary">New assessment</button>
        <button id="copySummary" class="secondary">Copy summary</button>
      </div>
    </section>
  </main>

  <nav id="bottomNav" class="bottom-nav">
    <button id="backBtn" class="back" disabled>← Back</button>
    <button id="whyBtn" class="why">Why this question?</button>
  </nav>

  <div id="whySheet" class="sheet hidden" aria-hidden="true">
    <div class="sheet-card">
      <div class="sheet-grabber"></div>
      <h2>Protocol basis</h2>
      <p id="whyText"></p>
      <button id="closeWhy" class="primary">Close</button>
    </div>
  </div>
</div>
<script src="protocol-data.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
</body>
</html>
